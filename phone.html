<title>Spot Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: single column, big photo button on top, result card below. */
  :root { --bg:#f6f7f5; --fg:#17201b; --muted:#5f6b64; --card:#ffffff; --line:#d9dfdb; --accent:#0f7a4d; --accent-fg:#ffffff; --bad:#9a3b2e;
          --font:"Inter",system-ui,sans-serif; --display:"Space Grotesk","Inter",system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121815; --fg:#e8eeea; --muted:#9aa8a0; --card:#1b231f; --line:#2c3832; --accent:#3ecf8e; --accent-fg:#06140d; --bad:#f08a78; color-scheme:dark } }
  :root[data-theme="dark"] { --bg:#121815; --fg:#e8eeea; --muted:#9aa8a0; --card:#1b231f; --line:#2c3832; --accent:#3ecf8e; --accent-fg:#06140d; --bad:#f08a78; color-scheme:dark }
  body { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; padding-block:20px;
         padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
  .wrap { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-family:var(--display); font-size:1.6rem; margin:0; text-wrap:balance; }
  p { margin:0; color:var(--muted); line-height:1.45; }
  label.field { display:flex; flex-direction:column; gap:6px; font-size:.85rem; color:var(--muted); }
  select { font:inherit; font-size:1rem; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); min-width:0; }
  input[type=text] { font:inherit; font-size:1rem; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); min-width:0; }
  .btn { display:flex; align-items:center; justify-content:center; padding:16px; border-radius:12px; background:var(--accent); color:var(--accent-fg); font-weight:600; font-size:1.05rem; cursor:pointer; border:0; }
  .btn:focus-within, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .btn input { position:absolute; width:1px; height:1px; opacity:0; }
  .preview { width:100%; max-height:320px; object-fit:contain; border-radius:12px; background:#000; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .verdict { font-family:var(--display); font-size:1.25rem; font-weight:600; }
  .verdict.yes { color:var(--accent); } .verdict.no { color:var(--bad); }
  ul { margin:0; padding-left:1.1em; display:flex; flex-direction:column; gap:4px; }
  .small { font-size:.85rem; color:var(--muted); }
</style>

<div class="wrap">
  <h1>Spot Check</h1>
  <p>Take a photo and Claude tells you what is in it and whether it matches what you are looking for.</p>

  <label class="field" for="target">Looking for (optional, comma separated)
    <input id="target" type="text" placeholder="e.g. red mug, house keys, ripe banana" autocomplete="off">
  </label>

  <label class="field" for="mode">Mode
    <select id="mode"><option value="dobble" selected>Dobble: find the matching symbol on two cards</option><option value="objects">Objects: what is in the photo</option></select>
  </label>

  <label class="btn" for="photo">Take photo
    <input id="photo" type="file" accept="image/*" capture="environment">
  </label>

  <img id="preview" class="preview" alt="Your photo" hidden>
  <div id="out" class="card" hidden aria-live="polite"></div>
  <p class="small" id="note"></p>
</div>

<script>
const $ = id => document.getElementById(id);
let sample = null;

(async () => {
  try { sample = await claude.use("sample"); } catch (e) {}
  if (!sample) { $("note").textContent = "Claude is not available in this view, so photos cannot be analysed here."; $("photo").disabled = true; }
})();

function shrink(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve({ blob: b, url: c.toDataURL("image/jpeg", .7) }) : reject(new Error("encode")), "image/jpeg", .85);
      URL.revokeObjectURL(url);
    };
    img.onerror = () => reject(new Error("Could not read that photo."));
    img.src = url;
  });
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

$("photo").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file || !sample) return;
  const out = $("out"); out.hidden = false; out.textContent = "Looking…";
  try {
    const { blob, url } = await shrink(file);
    $("preview").src = url; $("preview").hidden = false;
    const targets = $("target").value.split(",").map(s => s.trim()).filter(Boolean);
    if ($("mode").value === "dobble") {
      const dp = `The photo shows two (or more) round Dobble/Spot-It cards, each covered in small cartoon symbols. Exactly one symbol appears on both cards. List each card's symbols, then name the shared symbol(s) and say where it sits on each card (e.g. top left). Reply with JSON only: {"cards":[{"label":string,"symbols":[string]}],"shared":[{"symbol":string,"where":[string]}],"confidence":"high"|"medium"|"low"}. Label cards by position, like "left card" and "right card". If you cannot see two cards, return an empty shared list.`;
      const d = await sample.json(dp, { images: [blob], modelTier: "default", cache: false });
      const sh = d.shared || [];
      let h = sh.length
        ? `<div class="verdict yes">Match: ${sh.map(s => esc(s.symbol)).join(", ")}</div><ul>${sh.map(s => `<li><b>${esc(s.symbol)}</b>: ${(s.where || []).map(esc).join("; ")}</li>`).join("")}</ul><div class="small">Confidence: ${esc(d.confidence)}</div>`
        : `<div class="verdict no">No match found</div><div class="small">Get both whole cards in the frame, flat and well lit.</div>`;
      h += (d.cards || []).map(c => `<div class="small">${esc(c.label)}: ${(c.symbols || []).map(esc).join(", ")}</div>`).join("");
      out.innerHTML = h; e.target.value = ""; return;
    }
    const prompt = `Look at the attached photo. List the distinct objects you can clearly see.` +
      (targets.length ? ` The user is looking for: ${targets.join("; ")}. For each wanted item say whether it is present.` : "") +
      ` Reply with JSON only: {"objects":[string],"matches":[{"item":string,"found":boolean,"note":string}]}. ` +
      `"matches" is an empty array when nothing is wanted. Keep notes under 12 words.`;
    const r = await sample.json(prompt, { images: [blob], modelTier: "quick", cache: false });
    const objs = (r.objects || []).map(o => `<li>${esc(o)}</li>`).join("") || "<li>Nothing clear</li>";
    let html = "";
    if (targets.length) {
      const m = r.matches || [], hit = m.filter(x => x.found);
      html += `<div class="verdict ${hit.length ? "yes" : "no"}">${hit.length ? "✓ Match" : "No match"}</div>` +
        `<ul>${m.map(x => `<li>${x.found ? "✓" : "✗"} <b>${esc(x.item)}</b> ${esc(x.note)}</li>`).join("")}</ul>`;
    }
    html += `<div class="small">In the photo</div><ul>${objs}</ul>`;
    out.innerHTML = html;
  } catch (err) {
    out.textContent = err && err.code === "not_granted" ? "Allow Claude for this page to analyse photos." : "Something went wrong: " + (err.message || err.code || "try again");
  }
  e.target.value = "";
});
</script>
